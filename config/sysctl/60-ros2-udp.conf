# Large UDP receive buffers so ~0.9 MB camera images survive Fast DDS UDP transport
# (see workspace/src/franka_vr/franka_vr/config/fastdds_udp_only.xml).
# Install: sudo cp config/sysctl/60-ros2-udp.conf /etc/sysctl.d/ && sudo sysctl --system
net.core.rmem_max=2147483647
net.core.rmem_default=67108864
