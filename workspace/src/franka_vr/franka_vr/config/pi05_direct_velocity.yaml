pi05_direct_velocity_executor:
  ros__parameters:
    armed: false
    control_rate_hz: 100.0
    # 策略命令必须持续刷新；超过该时间就进入零速度停车。
    command_timeout_s: 0.12
    max_command_stamp_age_s: 0.20
    max_command_future_skew_s: 0.05
    max_feedback_age_s: 0.05
    collision_monitor_timeout_s: 0.15
    # 与 task2 的 run_20k runtime 设置一致。0.6 高于本轮观察到的模型峰值
    # 0.253 rad/s，因此不会再由 0.15 rad/s 的旧 direct 上限裁切该动作。
    max_joint_velocity_rad_s: 0.6
    # 100 Hz 执行器仍按 task2 的加速度值做安全整形；1 kHz 控制器使用同一
    # 加速度包络并约束 jerk 连续性，消除 Franka 报告的 acceleration_discontinuity。
    max_joint_acceleration_rad_s2: 2.0
    joint_limit_margin_rad: 0.15
    soft_tracking_error_rad: 0.03
    hard_tracking_error_rad: 0.08
    max_consecutive_deadline_misses: 3
    csv_log_path: ""

pi05_collision_monitor:
  ros__parameters:
    rate_hz: 20.0
