###############################################
# Independent MoveIt Servo configuration for pi0.5-DROID JointJog commands.
###############################################
thread_priority: 40
publish_period: 0.01
max_expected_latency: 0.1
incoming_command_timeout: 0.1

command_in_type: "speed_units"
scale:
  linear: 0.30
  rotational: 0.975
  joint: 0.15

command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false
use_smoothing: true
smoothing_filter_plugin_name: "online_signal_smoothing::AccelerationLimitedPlugin"

is_primary_planning_scene_monitor: true
check_octomap_collisions: false
move_group_name: fr3_arm
lower_singularity_threshold: 10.0
hard_stop_singularity_threshold: 30.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margins: [0.15]

pose_command_in_topic: ~/pose_target_cmds
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /fr3_arm_controller/joint_trajectory

check_collisions: true
collision_check_rate: 20.0
self_collision_proximity_threshold: 0.02
scene_collision_proximity_threshold: 0.03
