services:
  franka_vr:
    build:
      context: .
      dockerfile: Dockerfile
    image: franka-vr:humble
    container_name: franka_vr
    network_mode: host
    ipc: host
    privileged: true
    # Bound Docker's internal console log even if a disconnected camera loops.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # Keep the FCI real-time pair (4,5) exclusively for franka_robot.  The
    # generic service is also used by camera, VR and build containers; without
    # this exclusion those workloads may be scheduled on the control pair and
    # cause libfranka communication deadline violations.
    # CPU 2 is reserved for the FCI NIC interrupt.  Keep non-real-time
    # workloads away from it to avoid libfranka communication jitter.
    cpuset: "0-1,3,6-31"
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROBOT_IP: ${ROBOT_IP:-172.16.0.2}
      ROS_LOG_DIR: /runtime_logs/ros
      COLCON_LOG_PATH: /runtime_logs/colcon
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - ./workspace/src:/ws_franka_vr/src:rw
      - ${FRANKA_LOG_ROOT:-/media/mac/Elements1/franka_vr_docker/logs}:/runtime_logs:rw
      #- ./datasets:/datasets:rw
      - /media/mac/Elements:/datasets:rw
      # Keep one ADB key across disposable containers so Quest authorization
      # remains valid after `docker compose run --rm` exits.
      - quest_adb_keys:/root/.android
    stdin_open: true
    tty: true
    command: bash

  # Only the FCI control process needs the isolated real-time CPU pair.
  # Sensor, VR and build containers must not share it, otherwise their CPU
  # load can violate libfranka's 1 kHz communication deadline.
  franka_robot:
    extends:
      service: franka_vr
    container_name: franka_robot
    cpuset: "4,5"

volumes:
  quest_adb_keys:
