services:
  franka_vr:
    build:
      context: .
      dockerfile: Dockerfile
    image: franka-vr:humble
    container_name: franka_vr
    network_mode: host
    ipc: host
    privileged: true
    # Keep the 1 kHz control loop on one physical performance core
    # (CPU 4/5 are sibling threads of P-core 2 on this host).
    cpuset: "4,5"
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROBOT_IP: ${ROBOT_IP:-172.16.0.2}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - ./workspace/src:/ws_franka_vr/src:rw
      # Keep one ADB key across disposable containers so Quest authorization
      # remains valid after `docker compose run --rm` exits.
      - quest_adb_keys:/root/.android
    stdin_open: true
    tty: true
    command: bash

volumes:
  quest_adb_keys:
